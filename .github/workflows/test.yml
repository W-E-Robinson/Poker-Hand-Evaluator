name: Tests

on:
  pull_request:
    branches: [ '**' ]

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install cargo-nextest
      run: cargo install --locked cargo-nextest
    - name: Run tests
      run: cargo nextest run --fail-fast --nocapture
